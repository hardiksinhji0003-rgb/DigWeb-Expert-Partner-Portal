[build]
  command = "npm run build"
  publish = "dist"

# SPA Fallback: Ensures direct navigation and refresh on protected routes (dashboard, admin, etc.) do not 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
